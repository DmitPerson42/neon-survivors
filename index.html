<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON SURVIVORS - кибер-выживание</title>
<style>
html,body{margin:0;height:100%;background:#05010d;overflow:hidden;font-family:Consolas,'Segoe UI Symbol',monospace;color:#0ff;user-select:none}
canvas{display:block}
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.panel{pointer-events:auto;background:linear-gradient(160deg,rgba(25,0,45,.95),rgba(0,15,35,.95));border:2px solid #ff2bd6;box-shadow:0 0 30px #ff2bd6,inset 0 0 30px rgba(0,240,255,.15);padding:24px 32px;text-align:center;max-width:820px;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
h1{margin:0 0 8px;font-size:42px;letter-spacing:6px;color:#fff;text-shadow:0 0 8px #ff2bd6,0 0 20px #ff2bd6,3px 0 #00f0ff,-3px 0 #ff2a6d}
h2{color:#ffe600;text-shadow:0 0 12px #ffe600;margin:0 0 14px;letter-spacing:3px}
button{background:#0a0614;color:#0ff;border:1px solid #0ff;padding:10px 16px;margin:6px;font:inherit;font-size:16px;cursor:pointer;box-shadow:0 0 10px #0ff;transition:.12s}
button:hover{background:#0ff;color:#000;transform:translateY(-2px)}
.cards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.card{width:210px;min-height:190px;display:flex;flex-direction:column;align-items:center;padding:14px;border-width:2px}
.card .ic{font-size:40px;margin:4px 0 8px}
.card .nm{font-weight:bold;font-size:17px}
.card .lv{font-size:13px;margin:4px 0;color:#ffe600}
.card .ds{font-size:13px;color:#cfe;opacity:.9}
.new{color:#ff2bd6!important}
table{margin:10px auto;border-collapse:collapse;font-size:14px}
td{padding:3px 12px;border-bottom:1px solid #333;text-align:left}
p{color:#cfe}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ui=document.getElementById('ui');
let W,H,vig;
function rs(){W=cv.width=Math.max(1,innerWidth);H=cv.height=Math.max(1,innerHeight);vig=document.createElement('canvas');vig.width=W;vig.height=H;const v=vig.getContext('2d');
 const g=v.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(5,0,20,.85)');v.fillStyle=g;v.fillRect(0,0,W,H);
 v.fillStyle='rgba(0,0,0,.12)';for(let y=0;y<H;y+=3)v.fillRect(0,y,W,1);}
addEventListener('resize',rs);rs();
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Escape')togglePause()});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(state==='play')togglePause()});

// ---------- helpers ----------
const rnd=(a=1)=>(Math.random()*2-1)*a, TAU=Math.PI*2;
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
const glowCache={};
function glowSpr(c){if(!glowCache[c]){const g=document.createElement('canvas');g.width=g.height=64;const x=g.getContext('2d');const gr=x.createRadialGradient(32,32,0,32,32,32);
 gr.addColorStop(0,hexA(c,1));gr.addColorStop(.3,hexA(c,.45));gr.addColorStop(1,hexA(c,0));x.fillStyle=gr;x.fillRect(0,0,64,64);glowCache[c]=g}return glowCache[c]}
function glow(x,y,r,c,a=1){ctx.globalAlpha=a;ctx.drawImage(glowSpr(c),x-r,y-r,r*2,r*2);ctx.globalAlpha=1}
function poly(x,y,r,n,rot){ctx.beginPath();for(let i=0;i<=n;i++){const a=rot+i/n*TAU;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}ctx.closePath()}
const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');

// ---------- data ----------
const WP={
 blaster:{n:'Плазма-бластер',ic:'✦',c:'#00f0ff',d:'Автоогонь по ближайшему врагу.',up:['','+1 снаряд','+40% урона','+1 снаряд','Пробивает 3 врагов'],
  cd:l=>.85-.07*l,fire(w){const t=nearest(P.x,P.y,700);if(!t)return;const n=1+Math.floor(w.lv/2)+S.proj,a=Math.atan2(t.y-P.y,t.x-P.x);
   for(let i=0;i<n;i++)shoot(P.x,P.y,a+(i-(n-1)/2)*.13,650,{r:5,dmg:10+(w.lv>=3?6:0)+2*w.lv,pierce:w.lv>=5?3:1,life:1.3,w,kind:'bolt'})}},
 orbit:{n:'Орбитальные дроны',ic:'◎',c:'#5ce1ff',d:'Дроны вращаются вокруг тебя и режут врагов.',up:['','+1 дрон','+радиус и скорость','+1 дрон','+2 дрона'],
  tick(w,dt){const n=[0,2,3,3,4,6][w.lv]+S.proj,R=(70+(w.lv>=3?20:0))*S.area,dmg=7+3*w.lv;w.a=(w.a||0)+dt*(3+(w.lv>=3?1.2:0));w.pos=[];
   for(let i=0;i<n;i++){const a=w.a+i/n*TAU,x=P.x+Math.cos(a)*R,y=P.y+Math.sin(a)*R;w.pos.push([x,y]);
    for(const e of enemies){if(e.dead)continue;const dx=e.x-x,dy=e.y-y;if(dx*dx+dy*dy<(e.r+11*S.area)**2&&T-(e.ho||-9)>.35){e.ho=T;hit(e,dmg,Math.atan2(dy,dx),w)}}
    if(Math.random()<.5)part(x,y,rnd(20),rnd(20),.3,w.c,2)}}},
 emp:{n:'ЭМИ-импульс',ic:'◉',c:'#70ffd9',d:'Волна вокруг тебя отбрасывает врагов.',up:['','+радиус','+50% урона','-перезарядка','+радиус, оглушение'],
  cd:l=>3.2-.2*l-(l>=4?.5:0),fire(w){const R=(110+(w.lv>=2?30:0)+(w.lv>=5?40:0))*S.area,dmg=10+(w.lv>=3?8:0)+3*w.lv;
   rings.push({x:P.x,y:P.y,r:0,R,l:.45,ml:.45,c:w.c,w:10});rings.push({x:P.x,y:P.y,r:0,R:R*.7,l:.35,ml:.35,c:'#ffffff',w:3});
   for(const e of enemies){const dx=e.x-P.x,dy=e.y-P.y;if(!e.dead&&dx*dx+dy*dy<(R+e.r)**2){hit(e,dmg,Math.atan2(dy,dx),w,3.5);if(w.lv>=5)e.stun=.8}}}},
 rocket:{n:'Рой ракет',ic:'➶',c:'#4da6ff',d:'Самонаводящиеся ракеты со взрывом.',up:['','+1 ракета','+радиус взрыва','+1 ракета','+2 ракеты, +урон'],
  cd:l=>2.3-.15*l,fire(w){const n=1+(w.lv>=2?1:0)+(w.lv>=4?1:0)+(w.lv>=5?2:0)+S.proj;
   for(let i=0;i<n;i++)shoot(P.x,P.y,Math.random()*TAU,260,{r:6,dmg:20+(w.lv>=5?12:0)+5*w.lv,life:3,w,kind:'rocket',homing:1,explode:(55+(w.lv>=3?25:0))*S.area})}},
 mine:{n:'Нано-мины',ic:'✸',c:'#ffe600',d:'Мины на месте, взрываются при контакте.',up:['','+1 мина','+радиус','+1 мина','+80% урона'],
  cd:l=>1.6-.1*l,fire(w){const n=1+(w.lv>=2?1:0)+(w.lv>=4?1:0)+S.proj;
   for(let i=0;i<n;i++)mines.push({x:P.x+rnd(40),y:P.y+rnd(40),arm:.5,life:6,R:(75+(w.lv>=3?30:0))*S.area,dmg:(30+8*w.lv)*(w.lv>=5?1.8:1),w})}},
 disc:{n:'Рикошет-диск',ic:'◈',c:'#80ffff',d:'Диск отскакивает от краёв экрана.',up:['','+1 диск','+время жизни','+1 диск','+скорость и урон'],
  cd:l=>3.2-.2*l,fire(w){const n=1+(w.lv>=2?1:0)+(w.lv>=4?1:0)+S.proj;
   for(let i=0;i<n;i++)shoot(P.x,P.y,Math.random()*TAU,w.lv>=5?520:400,{r:11*S.area,dmg:10+(w.lv>=5?10:0)+3*w.lv,pierce:1e9,rehit:.4,life:(3+(w.lv>=3?2:0))*S.dur,w,kind:'disc',bounce:1})}}
};
const PS={
 amp:{n:'Усилитель урона',ic:'▲',c:'#ff3c3c',d:'+10% урона',max:5},
 cpu:{n:'Разгон ЦП',ic:'⌁',c:'#ffe600',d:'-8% перезарядки оружия',max:5},
 area:{n:'Фокус-линзы',ic:'◌',c:'#ff8c00',d:'+12% области и длительности',max:5},
 servo:{n:'Сервоприводы',ic:'»',c:'#3cff9e',d:'+10% скорости движения',max:5},
 dup:{n:'Дубликатор',ic:'⧉',c:'#ffffff',d:'+1 снаряд всем оружиям',max:2},
 armor:{n:'Кибер-броня',ic:'⛨',c:'#8c8cff',d:'-1 входящий урон, +20 HP',max:5},
 nano:{n:'Наноботы',ic:'✚',c:'#ff5cf4',d:'+0.4 HP/сек регенерация',max:5},
 magnet:{n:'Магнит',ic:'∩',c:'#00f0ff',d:'+40% радиус сбора опыта',max:5},
 crit:{n:'Нейрочип',ic:'✪',c:'#ffd700',d:'+6% шанс крита (x2.5)',max:5}
};
const EN={
 drone:{r:10,hp:8,spd:72,dmg:8,c:'#ff2a6d',xp:1,n:6},
 runner:{r:8,hp:6,spd:135,dmg:6,c:'#ff6b35',xp:1,n:3},
 brute:{r:19,hp:45,spd:46,dmg:15,c:'#c9184a',xp:5,n:4},
 spitter:{r:12,hp:22,spd:58,dmg:8,c:'#ff9f1c',xp:3,n:4,shoot:2.2},
 elite:{r:24,hp:320,spd:62,dmg:18,c:'#ff4d00',xp:25,n:8,chest:1},
 boss:{r:52,hp:3500,spd:52,dmg:30,c:'#ff003c',xp:100,n:10,shoot:.7,chest:3,boss:1}
};

// ---------- state ----------
let state='menu',P,S,T,enemies,proj,ebul,mines,gems,items,parts,rings,bolts,slashes,texts,blooms,banners,kills,lvl,xp,pending,shake,flash,spawnT,nextElite,nextBoss,nextSwarm,cam,rain;
const best=+localStorage.getItem('neonsurv_best')||0;
const pl=k=>P.pas[k]||0;
function recalc(){const old=P.max||100;
 S={dmg:1+.1*pl('amp'),cd:Math.pow(.92,pl('cpu')),area:1+.12*pl('area'),dur:1+.12*pl('area'),spd:190*(1+.1*pl('servo')),proj:pl('dup'),armor:pl('armor'),regen:.4*pl('nano'),mag:75*(1+.4*pl('magnet')),crit:.05+.06*pl('crit')};
 P.max=100+20*pl('armor');P.hp+=P.max-old}
function newGame(start){
 P={x:0,y:0,r:12,hp:100,max:100,inv:0,face:1,ang:0,weps:[],pas:{}};recalc();addItem('w',start);
 T=0;enemies=[];proj=[];ebul=[];mines=[];gems=[];items=[];parts=[];rings=[];bolts=[];slashes=[];texts=[];blooms=[];banners=[];
 kills=0;lvl=1;xp=0;pending=0;shake=0;flash=null;spawnT=0;nextElite=60;nextBoss=300;nextSwarm=90;cam={x:0,y:0};
 rain=Array.from({length:110},()=>({x:Math.random()*W,y:Math.random()*H,s:300+Math.random()*400,l:8+Math.random()*18}));
 Q=null;qCd=20;D=null;
 state='play';ui.innerHTML='';banner('ВХОД В СЕТЬ. ПРОДЕРЖИСЬ 15:00','#00f0ff')}
const need=()=>Math.floor(5+lvl*7+Math.pow(lvl,1.7));

// ---------- core ----------
function nearest(x,y,R,skip,nth=0){let best=null,bd=R*R;const cand=[];
 for(const e of enemies){if(e.dead||(skip&&skip.has(e)))continue;const d=(e.x-x)**2+(e.y-y)**2;if(d<bd){if(nth){cand.push([d,e])}else{bd=d;best=e}}}
 if(nth){cand.sort((a,b)=>a[0]-b[0]);return(cand[nth]||cand[0]||[])[1]||null}return best}
function shoot(x,y,a,sp,o){proj.push(Object.assign({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,sp,pierce:1,rehit:1e9,hit:new Map(),c:o.w?WP[o.w.k].c:'#fff'},o))}
function part(x,y,vx,vy,l,c,s){if(parts.length<1800)parts.push({x,y,vx,vy,l,ml:l,c,s})}
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=Math.random()*sp;part(x,y,Math.cos(a)*s,Math.sin(a)*s,.3+Math.random()*.5,c,2+Math.random()*3)}}
function text(x,y,v,c,big){if(texts.length>140&&!big)return;texts.push({x:x+rnd(8),y,v,c,l:.8,big})}
function banner(t,c){banners.push({t,c,l:3})}
function hit(e,dmg,a,w,kb=1){if(e.dead)return;let crit=Math.random()<S.crit;dmg*=S.dmg*(crit?2.5:1);e.hp-=dmg;e.flash=.08;w.dealt+=dmg;
 if(!e.boss){const k=110*kb/(e.r/10);e.kx+=Math.cos(a)*k;e.ky+=Math.sin(a)*k}
 text(e.x,e.y-e.r,Math.round(dmg),crit?'#ffe600':'#ffffff',crit);
 for(let i=0;i<2;i++)part(e.x,e.y,Math.cos(a)*150+rnd(80),Math.sin(a)*150+rnd(80),.25,e.c,2);
 if(e.hp<=0)kill(e,w)}
function kill(e,w){e.dead=true;kills++;qEvent('kill',w);burst(e.x,e.y,e.c,e.boss?120:e.chest?50:14,e.boss?500:220);burst(e.x,e.y,'#ffffff',e.boss?40:4,160);
 blooms.push({x:e.x,y:e.y,r:e.r*4,l:.3,ml:.3,c:e.c});rings.push({x:e.x,y:e.y,r:e.r,R:e.r*(e.boss?8:3),l:.35,ml:.35,c:e.c,w:3});
 if(e.boss||e.chest){shake=Math.max(shake,e.boss?25:10);items.push({x:e.x,y:e.y,t:'chest',n:e.chest})}
 gems.push({x:e.x,y:e.y,v:e.xp});
 const r=Math.random();if(r<.012)items.push({x:e.x+10,y:e.y,t:'heal'});else if(r<.017)items.push({x:e.x+10,y:e.y,t:'magnet'});else if(r<.02)items.push({x:e.x+10,y:e.y,t:'bomb'})}
function explode(x,y,R,dmg,c,w){blooms.push({x,y,r:R*1.6,l:.35,ml:.35,c});rings.push({x,y,r:R*.3,R,l:.3,ml:.3,c,w:6});burst(x,y,c,24,R*4);burst(x,y,'#ffffff',8,R*2);shake=Math.max(shake,4);
 for(const e of enemies){const dx=e.x-x,dy=e.y-y;if(!e.dead&&dx*dx+dy*dy<(R+e.r)**2)hit(e,dmg,Math.atan2(dy,dx),w,1.5)}}
function hurt(d){d=Math.max(1,d-S.armor);P.hp-=d;P.inv=.45;shake=Math.max(shake,8);flash={c:'#ff0040',l:.25,ml:.25};burst(P.x,P.y,'#ff2a6d',16,220);text(P.x,P.y-20,'-'+d,'#ff2a6d',1);
 qEvent('hurt');if(P.hp<=0)startDeath()}
function spawnE(t,x,y){const d=EN[t],hpM=1+T/50+(T>600?(T-600)/40:0);
 if(x===undefined){const a=Math.random()*TAU,R=Math.hypot(W,H)/2+40;x=P.x+Math.cos(a)*R;y=P.y+Math.sin(a)*R}
 enemies.push({t,x,y,r:d.r,hp:d.hp*hpM,max:d.hp*hpM,spd:d.spd*(1+Math.min(.5,T/1200)),dmg:d.dmg,c:d.c,xp:d.xp,n:d.n,shoot:d.shoot,sc:d.shoot?Math.random()*2:0,chest:d.chest,boss:d.boss,kx:0,ky:0,flash:0,rot:Math.random()*TAU,stun:0})}
function pickType(){const r=Math.random();if(T>200&&r<.12)return'spitter';if(T>110&&r<.27)return'brute';if(T>40&&r<.5)return'runner';return'drone'}
function addItem(kind,k){if(kind==='w'){const o=P.weps.find(w=>w.k===k);if(o)o.lv++;else P.weps.push({k,lv:1,t:.2,dealt:0})}else{P.pas[k]=pl(k)+1;recalc()}}
function choices(n){const pool=[];
 for(const k in WP){const o=P.weps.find(w=>w.k===k);if(o?o.lv<5:P.weps.length<6)pool.push(['w',k])}
 for(const k in PS){const l=pl(k);if(l?l<PS[k].max:Object.keys(P.pas).length<6)pool.push(['p',k])}
 for(let i=pool.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[pool[i],pool[j]]=[pool[j],pool[i]]}return pool.slice(0,n)}

function update(dt){
 T+=dt;
 let dx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),dy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);const l=Math.hypot(dx,dy);
 if(l){dx/=l;dy/=l;P.x+=dx*S.spd*dt;P.y+=dy*S.spd*dt;P.ang=Math.atan2(dy,dx);if(dx)P.face=Math.sign(dx);
  part(P.x-dx*12+rnd(4),P.y-dy*12+rnd(4),-dx*80+rnd(30),-dy*80+rnd(30),.35,Math.random()<.5?'#00f0ff':'#ff2bd6',3)}
 P.inv-=dt;P.hp=Math.min(P.max,P.hp+S.regen*dt);
 cam.x+=(P.x-cam.x)*Math.min(1,dt*8);cam.y+=(P.y-cam.y)*Math.min(1,dt*8);
 for(const w of P.weps){const d=WP[w.k];if(d.tick)d.tick(w,dt);else{w.t-=dt;if(w.t<=0){w.t=d.cd(w.lv)*S.cd;d.fire(w)}}}
 // spawning
 spawnT-=dt;const target=Math.min(380,14+T*.75);
 if(spawnT<=0&&enemies.length<target){spawnT=Math.max(.06,.55-T/500);for(let i=0;i<1+Math.floor(T/100);i++)spawnE(pickType())}
 if(T>=nextElite){nextElite+=60;spawnE('elite');banner('ЭЛИТНЫЙ ВРАГ: НЕСЁТ КЕЙС','#ff8c00')}
 if(T>=nextSwarm){nextSwarm+=90;const R=Math.min(W,H)*.55;for(let i=0;i<36;i++){const a=i/36*TAU;spawnE(T>200?'runner':'drone',P.x+Math.cos(a)*R,P.y+Math.sin(a)*R)}banner('РОЙ ОКРУЖАЕТ!','#ff2bd6')}
 if(T>=nextBoss){nextBoss+=300;spawnE('boss');banner('⚠ БОСС: ЯДРО-СТРАЖ ⚠','#ff2a6d');flash={c:'#ff2a6d',l:.5,ml:.5}}
 if(T>=900)return startVictory();
 // enemies + separation grid
 const grid=new Map();
 for(const e of enemies){const k=(Math.floor(e.x/36)*7919+Math.floor(e.y/36));let c=grid.get(k);if(!c)grid.set(k,c=[]);c.push(e)}
 for(const e of enemies){if(e.dead)continue;
  const ax=P.x-e.x,ay=P.y-e.y,d=Math.hypot(ax,ay)||1;
  if(d>1400&&!e.boss){const a=Math.random()*TAU,R=Math.hypot(W,H)/2+40;e.x=P.x+Math.cos(a)*R;e.y=P.y+Math.sin(a)*R;continue}
  let sp=e.stun>0?0:e.spd;if(e.t==='spitter'&&d<240)sp=-20;e.stun-=dt;
  e.x+=(ax/d*sp+e.kx)*dt;e.y+=(ay/d*sp+e.ky)*dt;e.kx*=Math.pow(.02,dt);e.ky*=Math.pow(.02,dt);e.flash-=dt;e.rot+=dt*(e.t==='runner'?6:1.2);
  const c=grid.get(Math.floor(e.x/36)*7919+Math.floor(e.y/36));
  if(c)for(const o of c){if(o===e)continue;const sx=e.x-o.x,sy=e.y-o.y,sd=Math.hypot(sx,sy)||.1,m=e.r+o.r;if(sd<m){const p=(m-sd)/sd*.25;e.x+=sx*p;e.y+=sy*p}}
  if(e.shoot&&d<600){e.sc-=dt;if(e.sc<=0){e.sc=e.shoot;if(e.boss){const n=14,o=T*1.3;for(let i=0;i<n;i++){const a=o+i/n*TAU;ebul.push({x:e.x,y:e.y,vx:Math.cos(a)*190,vy:Math.sin(a)*190,l:4,c:e.c})}}
   else ebul.push({x:e.x,y:e.y,vx:ax/d*230,vy:ay/d*230,l:3,c:e.c})}}
  if(P.inv<=0&&d<e.r+P.r)hurt(e.dmg)}
 enemies=enemies.filter(e=>!e.dead);
 // projectiles
 for(const b of proj){

  for(const e of enemies){if(e.dead)continue;const dx=e.x-b.x,dy=e.y-b.y;if(dx*dx+dy*dy<(e.r+b.r)**2){const lt=b.hit.get(e);if(lt!==undefined&&T-lt<b.rehit)continue;

  if(go){explode(m.x,m.y,m.R,m.dmg,'#ffe600',m.w);m.done=1}}

  for(let i=0;i<5;i++)rings.push({x:P.x,y:P.y,r:10,R:100+i*60,l:.5+i*.1,ml:.5+i*.1,c:i%2?'#ffd700':'#ffffff',w:4});burst(P.x,P.y,'#ffd700',70,380);

  // enemies
  for(const e of enemies){if(Math.abs(e.x-cx)>W/2+60||Math.abs(e.y-cy)>H/2+60)continue;
   glow(e.x,e.y,e.r*1.8,e.c,e.boss?.75:.28);
   ctx.globalCompositeOperation='source-over';ctx.fillStyle=e.flash>0?'#ffffff':'rgba(18,2,10,.92)';poly(e.x,e.y,e.r,e.n,e.rot);ctx.fill();
   ctx.strokeStyle=e.flash>0?'#fff':e.c;ctx.lineWidth=e.boss?4:2.2;poly(e.x,e.y,e.r,e.n,e.rot);ctx.stroke();
   ctx.fillStyle=e.c;ctx.beginPath();ctx.arc(e.x,e.y,e.r*.22,0,TAU);ctx.fill();
   if(e.boss||e.chest){ctx.strokeStyle=hexA(e.c,.6);poly(e.x,e.y,e.r*1.35,e.n,-e.rot*1.5);ctx.stroke()}
   if(e.hp<e.max&&(e.boss||e.chest||e.t==='brute')){ctx.fillStyle=hexA(e.c,.3);ctx.fillRect(e.x-e.r,e.y-e.r-10,e.r*2,4);ctx.fillStyle=e.c;ctx.fillRect(e.x-e.r,e.y-e.r-10,e.r*2*e.hp/e.max,4)}}
  ctx.globalCompositeOperation='lighter';
  for(const b of ebul){glow(b.x,b.y,16,'#ff1e00',.9);ctx.globalCompositeOperation='source-over';ctx.fillStyle='#ff1e00';ctx.beginPath();ctx.arc(b.x,b.y,5,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,2.5,0,TAU);ctx.fill();ctx.globalCompositeOperation='lighter'}
  // projectiles
  for(const b of proj){if(b.kind==='bolt'){const a=Math.atan2(b.vy,b.vx);glow(b.x,b.y,16,b.c,.9);ctx.strokeStyle=b.c;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-Math.cos(a)*18,b.y-Math.sin(a)*18);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke()}
   else if(b.kind==='rocket'){glow(b.x,b.y,20,'#4da6ff',1);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,3.5,0,TAU);ctx.fill()}
   else if(b.kind==='disc'){glow(b.x,b.y,b.r*2.6,b.c,.8);ctx.strokeStyle=b.c;ctx.lineWidth=3;poly(b.x,b.y,b.r,6,t*12);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=1;poly(b.x,b.y,b.r*.5,6,-t*12);ctx.stroke()}}
  // orbit drones
  for(const w of P.weps)if(w.pos)for(const [x,y] of w.pos){glow(x,y,26,WP.orbit.c,.9);ctx.fillStyle='#fff';poly(x,y,6,4,t*8);ctx.fill();ctx.strokeStyle=WP.orbit.c;ctx.lineWidth=2;poly(x,y,10,4,-t*5);ctx.stroke()}
  // slashes
  for(const s of slashes){const k=s.l/s.ml;ctx.save();ctx.translate(s.x,s.y);ctx.scale(s.d,1);ctx.globalAlpha=k;
   ctx.strokeStyle=s.c;ctx.lineWidth=s.h*.5*k+2;ctx.beginPath();ctx.ellipse(-s.w*.2,0,s.w*.62,s.h*.55,0,-1.1,1.1);ctx.stroke();
   ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.restore();glow(s.x,s.y,s.w*.6,s.c,k*.6)}
  // lightning
  for(const b of bolts){ctx.globalAlpha=b.l/b.ml;for(const [lw,c] of [[6,b.c],[2,'#ffffff']]){ctx.strokeStyle=c;ctx.lineWidth=lw;ctx.beginPath();ctx.moveTo(b.pts[0][0],b.pts[0][1]);
   for(let i=1;i<b.pts.length;i++){const [ax,ay]=b.pts[i-1],[bx,by]=b.pts[i];for(let s=1;s<=5;s++){const f=s/5;ctx.lineTo(ax+(bx-ax)*f+(s<5?rnd(12):0),ay+(by-ay)*f+(s<5?rnd(12):0))}}ctx.stroke()}
   for(const p of b.pts)glow(p[0],p[1],30,b.c,b.l/b.ml)}ctx.globalAlpha=1;
  for(const r of rings){const k=1-r.l/r.ml,rad=r.r+(r.R-r.r)*(1-Math.pow(1-k,3));ctx.globalAlpha=r.l/r.ml;ctx.strokeStyle=r.c;ctx.lineWidth=r.w*(1-k)+1;ctx.beginPath();ctx.arc(r.x,r.y,rad,0,TAU);ctx.stroke()}ctx.globalAlpha=1;
  // quest zone
  if(Q&&Q.ty==='zone'){const p=.5+.5*Math.sin(t*4);glow(Q.zx,Q.zy,Q.zr*1.6,'#ffd700',.25+.2*p);ctx.strokeStyle='#ffd700';ctx.lineWidth=2;poly(Q.zx,Q.zy,Q.zr,6,t*.5);ctx.stroke();
   ctx.lineWidth=6;ctx.beginPath();ctx.arc(Q.zx,Q.zy,Q.zr+10,-Math.PI/2,-Math.PI/2+TAU*Q.prog/Q.goal);ctx.stroke();ctx.fillStyle='#ffd700';poly(Q.zx,Q.zy,10+4*p,6,-t);ctx.fill()}
  if(state==='dying')drawDeathWorld(t);
  // player
  const blink=P.inv>0&&Math.floor(t*25)%2;if(!(D&&D.boom)){glow(P.x,P.y,48,'#00f0ff',.55);glow(P.x,P.y,30,'#ff2bd6',.35)}
  if(!blink&&!(D&&D.boom)){ctx.save();ctx.translate(P.x,P.y);ctx.rotate(P.ang);ctx.globalCompositeOperation='source-over';ctx.fillStyle='#0a0618';ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(-11,-12);ctx.lineTo(-5,0);ctx.lineTo(-11,12);ctx.closePath();ctx.fill();
   ctx.globalCompositeOperation='lighter';ctx.strokeStyle='#00f0ff';ctx.lineWidth=2.5;ctx.stroke();ctx.fillStyle='#ff2bd6';ctx.beginPath();ctx.arc(2,0,3.5,0,TAU);ctx.fill();ctx.restore()}
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(255,42,109,.25)';ctx.fillRect(P.x-20,P.y+20,40,4);ctx.fillStyle='#ff2a6d';ctx.fillRect(P.x-20,P.y+20,40*Math.max(0,P.hp)/P.max,4);
  // damage numbers
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const tx of texts){ctx.globalAlpha=Math.min(1,tx.l*2);ctx.font=(tx.big?'bold 20px ':'13px ')+'Consolas';ctx.fillStyle='#000';ctx.fillText(tx.v,tx.x+1,tx.y+1);ctx.fillStyle=tx.c;ctx.fillText(tx.v,tx.x,tx.y)}ctx.globalAlpha=1;
 }
 // screen space
 ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='lighter';ctx.strokeStyle='rgba(0,240,255,.18)';ctx.lineWidth=1;ctx.beginPath();
 for(const r of rain||[]){ctx.moveTo(r.x,r.y);ctx.lineTo(r.x-r.l*.25,r.y+r.l)}ctx.stroke();ctx.globalCompositeOperation='source-over';
 if(W>0&&H>0)ctx.drawImage(vig,0,0);
 if(flash){ctx.fillStyle=hexA(flash.c,.35*flash.l/flash.ml);ctx.fillRect(0,0,W,H)}
 if(state!=='menu'&&state!=='dying'&&state!=='victory')hud(t);
 if(state==='dying')drawDeathScreen();
 if(state==='victory')drawVictoryScreen()}
function hud(t){
 const k=xp/need(),g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,'#00f0ff');g.addColorStop(1,'#ff2bd6');
 ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,10);ctx.fillStyle=g;ctx.fillRect(0,0,W*k,10);ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(W*k-2,0,2,10);
 ctx.textBaseline='top';ctx.font='bold 18px Consolas';ctx.textAlign='left';ctx.fillStyle='#ffe600';ctx.fillText('УР '+lvl,14,18);
 ctx.textAlign='right';ctx.fillStyle='#ff2bd6';ctx.fillText('☠ '+kills,W-14,18);
 ctx.textAlign='center';ctx.font='bold 30px Consolas';ctx.fillStyle='#ff2a6d';ctx.fillText(fmt(T),W/2+2,18);ctx.fillStyle='#00f0ff';ctx.fillText(fmt(T),W/2-2,18);ctx.fillStyle='#fff';ctx.fillText(fmt(T),W/2,18);
 // inventory
 const icons=[...P.weps.map(w=>[WP[w.k],w.lv,5]),...Object.keys(P.pas).map(k=>[PS[k],P.pas[k],PS[k].max])];
 icons.forEach(([d,l,mx],i)=>{const row=i<P.weps.length?0:1,col=row?i-P.weps.length:i,x=14+col*44,y=H-96+row*46;
  ctx.fillStyle='rgba(5,0,20,.75)';ctx.fillRect(x,y,38,38);ctx.strokeStyle=d.c;ctx.lineWidth=l>=mx?3:1.5;ctx.strokeRect(x,y,38,38);
  ctx.font='20px Segoe UI Symbol,Consolas';ctx.textBaseline='middle';ctx.fillStyle=d.c;ctx.fillText(d.ic,x+19,y+17);
  ctx.font='bold 10px Consolas';ctx.fillStyle=l>=mx?'#ffe600':'#fff';ctx.fillText(l>=mx?'MAX':l,x+19,y+32)});
 for(const b of banners){const a=Math.min(1,b.l,(3-b.l)*4);ctx.globalAlpha=a;ctx.font='bold 26px Consolas';ctx.textBaseline='middle';const y=H*.22,j=Math.random()<.1?rnd(6):0;
  ctx.fillStyle='#ff2a6d';ctx.fillText(b.t,W/2+3+j,y);ctx.fillStyle='#00f0ff';ctx.fillText(b.t,W/2-3-j,y);ctx.fillStyle=b.c;ctx.fillText(b.t,W/2,y);ctx.globalAlpha=1}
 if(Q){const x=W-270,y=50,k=Math.min(1,Q.prog/Q.goal);ctx.textAlign='left';ctx.textBaseline='top';ctx.fillStyle='rgba(20,10,0,.7)';ctx.fillRect(x,y,256,64);ctx.strokeStyle='#ffd700';ctx.lineWidth=1.5;ctx.strokeRect(x,y,256,64);
  ctx.font='bold 13px Consolas';ctx.fillStyle='#ffd700';ctx.fillText('КОНТРАКТ  +'+Q.rew+' XP',x+8,y+6);ctx.font='13px Consolas';ctx.fillStyle='#fff';ctx.fillText(Q.txt,x+8,y+24);
  ctx.fillStyle='#332200';ctx.fillRect(x+8,y+44,240,10);ctx.fillStyle='#ffd700';ctx.fillRect(x+8,y+44,240*k,10);
  ctx.textAlign='right';ctx.fillStyle=Q.time<6?'#ff2a6d':'#fff';ctx.fillText((Q.ty==='nohit'?'':Math.ceil(Q.time)+'с  ')+Math.floor(Q.prog)+'/'+Q.goal,x+248,y+6);ctx.textAlign='center';
  if(Q.ty==='zone'){const dx=Q.zx-cam.x,dy=Q.zy-cam.y;if(Math.abs(dx)>W/2-30||Math.abs(dy)>H/2-30){const a=Math.atan2(dy,dx),s=Math.min((W/2-40)/Math.abs(Math.cos(a)),(H/2-40)/Math.abs(Math.sin(a)));
   ctx.save();ctx.translate(W/2+Math.cos(a)*s,H/2+Math.sin(a)*s);ctx.rotate(a);ctx.fillStyle='#ffd700';ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-8,-10);ctx.lineTo(-8,10);ctx.fill();ctx.restore()}}}
 if(P.hp<P.max*.3){ctx.fillStyle=`rgba(255,0,60,${.12+.08*Math.sin(t*8)})`;ctx.fillRect(0,0,W,H)}}

let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(rain)for(const r of rain){r.y+=r.s*dt;r.x-=r.s*.25*dt;if(r.y>H){r.y=-20;r.x=Math.random()*(W+200)}}
 if(state==='play')update(dt);else if(state==='dying')deathUpdate(dt);else if(state==='victory')victoryUpdate(dt);draw(now);requestAnimationFrame(loop)}
function menu(){state='menu';rain=Array.from({length:110},()=>({x:Math.random()*W,y:Math.random()*H,s:300+Math.random()*400,l:8+Math.random()*18}));
 const b=+localStorage.getItem('neonsurv_best')||0;
 ui.innerHTML=`<div class="panel"><h1>NEON SURVIVORS</h1><p>Мегаполис захвачен вирусным роем. Продержись <b style="color:#ffe600">15 минут</b>.<br>Оружие стреляет само - ты только двигаешься (WASD / стрелки). Esc - пауза.<br>Собирай кристаллы опыта, выбирай улучшения, круши боссов и открывай кейсы.</p>
 <h2>ВЫБЕРИ СТАРТОВОЕ ОРУЖИЕ</h2><div class="cards">${['blaster','orbit','rocket','emp'].map(k=>{const d=WP[k];return `<button class="card" style="border-color:${d.c};box-shadow:0 0 14px ${d.c};min-height:150px" onclick="newGame('${k}')"><div class="ic" style="color:${d.c};text-shadow:0 0 14px ${d.c}">${d.ic}</div><div class="nm">${d.n}</div><div class="ds">${d.d}</div></button>`}).join('')}</div>
 <p style="font-size:13px">6 видов оружия · 9 предметов · рекорд: ${b}</p></div>`}
menu();requestAnimationFrame(loop);
</script>
