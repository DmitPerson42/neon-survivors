
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05010d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>NEON SURVIVORS - кибер-выживание</title>
<style>
html,body{margin:0;height:100%;background:#05010d;overflow:hidden;font-family:Consolas,'Segoe UI Symbol',monospace;color:#0ff;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{display:block}
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.panel{pointer-events:auto;background:linear-gradient(160deg,rgba(25,0,45,.95),rgba(0,15,35,.95));border:2px solid #ff2bd6;box-shadow:0 0 30px #ff2bd6,inset 0 0 30px rgba(0,240,255,.15);padding:24px 32px;text-align:center;max-width:820px;max-height:94vh;overflow:auto;box-sizing:border-box;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
h1{margin:0 0 8px;font-size:42px;letter-spacing:6px;color:#fff;text-shadow:0 0 8px #ff2bd6,0 0 20px #ff2bd6,3px 0 #00f0ff,-3px 0 #ff2a6d}
h2{color:#ffe600;text-shadow:0 0 12px #ffe600;margin:0 0 14px;letter-spacing:3px}
button{background:#0a0614;color:#0ff;border:1px solid #0ff;padding:10px 16px;margin:6px;font:inherit;font-size:16px;cursor:pointer;box-shadow:0 0 10px #0ff;transition:.12s}
button:hover{background:#0ff;color:#000;transform:translateY(-2px)}
.cards{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.card{width:210px;min-height:190px;display:flex;flex-direction:column;align-items:center;padding:14px;border-width:2px}
.card .ic{font-size:40px;margin:4px 0 8px}
.card .nm{font-weight:bold;font-size:17px}
.card .lv{font-size:13px;margin:4px 0;color:#ffe600}
.card .ds{font-size:13px;color:#cfe;opacity:.9}
.new{color:#ff2bd6!important}
table{margin:10px auto;border-collapse:collapse;font-size:14px}
td{padding:3px 12px;border-bottom:1px solid #333;text-align:left}
p{color:#cfe}
.evo{font-size:11px;margin-top:6px;opacity:.95}
.badge{font-size:10px;color:#ffd700;border:1px solid #ffd700;padding:1px 4px;margin-top:4px}
.bar{height:5px;background:#221133;margin-top:3px}
.bar>i{display:block;height:5px;background:#00f0ff}
@media (max-width:760px){
 .panel{padding:14px 12px;max-width:96vw;border-width:1px}
 h1{font-size:26px;letter-spacing:3px}h2{font-size:17px;margin:0 0 8px}
 button{padding:10px 12px;margin:4px;font-size:14px}
 .cards{gap:8px}
 .card{width:148px;min-height:150px;padding:8px}
 .card .ic{font-size:28px;margin:2px 0 4px}.card .nm{font-size:13px}.card .lv,.card .ds{font-size:11px}
 table{font-size:12px}td{padding:2px 6px}p{font-size:13px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),ui=document.getElementById('ui');
// ---------- settings (persisted) ----------
const SET=Object.assign({mute:false,vol:.7,music:true,fx:2,dpr:2,vib:true},(()=>{try{return JSON.parse(localStorage.getItem('neonsurv_set')||'{}')}catch(e){return{}}})());
const saveSet=()=>{try{localStorage.setItem('neonsurv_set',JSON.stringify(SET))}catch(e){}};
const FXS=()=>[.25,.55,1][SET.fx],FXA=()=>[.2,.55,1][SET.fx];
const buzz=ms=>{if(SET.vib&&navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}};
// logical viewport: W/H = CSS px (screen space), LW/LH = logical game units
let W,H,LW,LH,Z=1,DPR=1,vig,rain=null;
function mkRain(){rain=SET.fx?Array.from({length:SET.fx===2?110:50},()=>({x:Math.random()*W,y:Math.random()*H,s:300+Math.random()*400,l:8+Math.random()*18})):[]}
function rs(){W=Math.max(1,innerWidth);H=Math.max(1,innerHeight);DPR=Math.min(SET.dpr,devicePixelRatio||1);
 Z=Math.max(.3,Math.min(.7,Math.min(W/1280,H/720)*.5));LW=W/Z;LH=H/Z;
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
 mkRain();vig=document.createElement('canvas');vig.width=W;vig.height=H;const v=vig.getContext('2d');
 const g=v.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(5,0,20,.85)');v.fillStyle=g;v.fillRect(0,0,W,H);
 v.fillStyle='rgba(0,0,0,.12)';for(let y=0;y<H;y+=3)v.fillRect(0,y,W,1);}
addEventListener('resize',rs);rs();
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;audioInit();
 if(e.code==='Escape')togglePause();
 if(e.code==='Space'){dash();if(e.preventDefault)e.preventDefault()}
 if(e.code==='KeyM'){SET.mute=!SET.mute;saveSet();if(!SET.mute)audioInit();if(banners)banner(SET.mute?'ЗВУК ВЫКЛ':'ЗВУК ВКЛ','#00f0ff')}
 if(state==='lvl'){if(e.code==='KeyR')rerollLv();if(e.code==='KeyX')skipLv();
  const n={Digit1:0,Digit2:1,Digit3:2}[e.code];if(n!==undefined&&curOpts[n])pickLv(curOpts[n][0],curOpts[n][1])}
 if(e.preventDefault&&/^(Space|ArrowUp|ArrowDown|ArrowLeft|ArrowRight)$/.test(e.code))e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=false);
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(state==='play')togglePause()});

// ---------- helpers ----------
const rnd=(a=1)=>(Math.random()*2-1)*a, TAU=Math.PI*2, VER='v1.6.3';
// ---------- seeded RNG (daily / shareable seeds) ----------
const nativeRandom=Math.random;let seedVal=0;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function setSeed(s){seedVal=s>>>0;Math.random=seedVal?mulberry32(seedVal):nativeRandom}
function dailySeed(){const d=new Date(),s=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const dayKey=()=>new Date().toISOString().slice(0,10);
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}
const glowCache={};
function glowSpr(c){if(!glowCache[c]){const g=document.createElement('canvas');g.width=g.height=64;const x=g.getContext('2d');const gr=x.createRadialGradient(32,32,0,32,32,32);
 gr.addColorStop(0,hexA(c,1));gr.addColorStop(.3,hexA(c,.45));gr.addColorStop(1,hexA(c,0));x.fillStyle=gr;x.fillRect(0,0,64,64);glowCache[c]=g}return glowCache[c]}
function glow(x,y,r,c,a=1){ctx.globalAlpha=a;ctx.drawImage(glowSpr(c),x-r,y-r,r*2,r*2);ctx.globalAlpha=1}
function poly(x,y,r,n,rot){ctx.beginPath();for(let i=0;i<=n;i++){const a=rot+i/n*TAU;ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}ctx.closePath()}
const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');

// ---------- audio: WebAudio synth, no assets ----------
let AC=null,MG=null,musT=0,musStep=0,hbT=0;
function audioInit(){if(AC){if(AC.state==='suspended')AC.resume();return}
 try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=SET.vol*.55;MG.connect(AC.destination)}catch(e){AC=null}}
function volUp(){if(MG)MG.gain.value=SET.vol*.55}
function sfx(f=440,d=.08,type='square',v=.15,slide=0){if(!AC||SET.mute)return;
 try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sfxT={};
function sfxOnce(k,gap,f,d,type,v,slide){const n=performance.now();if(n-(sfxT[k]||0)<gap)return;sfxT[k]=n;sfx(f,d,type,v,slide)}
function chord(fs,d=.14,type='square',v=.12){fs.forEach((f,i)=>setTimeout(()=>sfx(f,d,type,v),i*70))}
function noise(d=.25,v=.18,f=900){if(!AC||SET.mute)return;
 try{const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),ch=b.getChannelData(0);
 for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
 const s=AC.createBufferSource(),g=AC.createGain(),bp=AC.createBiquadFilter();s.buffer=b;bp.type='lowpass';bp.frequency.value=f;
 g.gain.value=v;s.connect(bp);bp.connect(g);g.connect(MG);s.start()}catch(e){}}
// dynamic music layer: tempo + intensity follow enemy count
function music(dt){if(!AC||SET.mute||!SET.music||state!=='play')return;musT-=dt;
 if(musT<=0){const it=Math.min(1,(enemies?enemies.length:0)/160);musT=.5-.2*it;
  const sc=[55,65.4,73.4,82.4,98],f=sc[musStep%5]*(musStep%8<4?1:1.5);
  sfx(f,.24,'sawtooth',.045+.03*it);if(musStep%4===0)sfx(f*4,.07,'square',.02+.02*it);
  if(it>.5&&musStep%2)sfx(f*6,.05,'triangle',.02);musStep++}}

// ---------- touch: floating stick (left) / tap pause + double-tap dash (right) ----------
let stick=null,tapT=0,tapTimer=0;
addEventListener('pointerdown',e=>{audioInit();if(e.pointerType!=='touch')return;
 if(state==='lvl'||state==='pause'||state==='menu'||state==='over')return;
 if(e.clientX<W*.55){stick={id:e.pointerId,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,dx:0,dy:0}}
 else{const n=performance.now();
  if(n-tapT<300){clearTimeout(tapTimer);if(state==='pause')togglePause();dash()}
  else tapTimer=setTimeout(()=>{if(state==='play')togglePause()},260);
  tapT=n}});
addEventListener('pointermove',e=>{if(stick&&e.pointerId===stick.id){stick.x=e.clientX;stick.y=e.clientY;
 const dx=e.clientX-stick.x0,dy=e.clientY-stick.y0,l=Math.hypot(dx,dy)||1,m=Math.min(l,60)/60;stick.dx=dx/l*m;stick.dy=dy/l*m}});
const pUp=e=>{if(stick&&e.pointerId===stick.id)stick=null};
addEventListener('pointerup',pUp);addEventListener('pointercancel',pUp);

// ---------- gamepad ----------
const gp={dx:0,dy:0},gpPrev={};
function gamepad(){const gs=navigator.getGamepads?navigator.getGamepads():null,p=gs&&gs[0];
 if(!p){gp.dx=gp.dy=0;return}
 const dz=v=>Math.abs(v||0)<.22?0:v;gp.dx=dz(p.axes[0]);gp.dy=dz(p.axes[1]);
 const edge=i=>{const b=p.buttons[i],v=!!(b&&(b.pressed||b.value>.5)),was=gpPrev[i];gpPrev[i]=v;return v&&!was};
 if(edge(9))togglePause();
 if(state==='lvl'){if(edge(0)&&curOpts[0])pickLv(curOpts[0][0],curOpts[0][1]);if(edge(1))skipLv();if(edge(2))rerollLv()}
 else if(state==='play'){if(edge(5)||edge(7))dash();if(edge(0))audioInit()}}

// ---------- dash ----------
function dash(){if(state!=='play'||!P||P.dashCd>0)return;
 const a=(P.mvx||P.mvy)?Math.atan2(P.mvy,P.mvx):P.ang,d=130;
 for(let i=0;i<12;i++)part(P.x-Math.cos(a)*i*11,P.y-Math.sin(a)*i*11,rnd(40),rnd(40),.3,i%2?'#00f0ff':'#ff2bd6',3);
 P.x+=Math.cos(a)*d;P.y+=Math.sin(a)*d;cam.x=P.x;cam.y=P.y;P.inv=Math.max(P.inv,.25);P.dashCd=3;
 rings.push({x:P.x,y:P.y,r:6,R:70,l:.25,ml:.25,c:'#00f0ff',w:3});sfx(680,.14,'sine',.12,520);buzz(10)}

// ---------- data ----------
const WP={
 blaster:{n:'Плазма-бластер',ic:'✦',c:'#00f0ff',d:'Автоогонь по ближайшему врагу.',up:['','+1 снаряд','+40% урона','+1 снаряд','Пробивает 3 врагов'],
  evo:{req:'cpu',n:'Гипер-бластер',ic:'✺',d:'Шквальный огонь пробивающими импульсами'},
  cd:l=>.85-.07*Math.min(5,l),fire(w){const t=nearest(P.x,P.y,700);if(!t)return;const ov=w.lv>5?Math.pow(1.15,w.lv-5):1;const n=1+Math.floor(Math.min(5,w.lv)/2)+S.proj+(w.evo?2:0),a=Math.atan2(t.y-P.y,t.x-P.x);
   for(let i=0;i<n;i++)shoot(P.x,P.y,a+(i-(n-1)/2)*.11,w.evo?820:650,{r:w.evo?6:5,dmg:(10+(w.lv>=3?6:0)+2*Math.min(5,w.lv))*ov*(w.evo?1.5:1),pierce:w.evo?8:(w.lv>=5?3:1),life:1.3,w,kind:'bolt'})}},
 orbit:{n:'Орбитальные дроны',ic:'◎',c:'#5ce1ff',d:'Дроны вращаются вокруг тебя и режут врагов.',up:['','+1 дрон','+радиус и скорость','+1 дрон','+2 дрона'],
  evo:{req:'dup',n:'Боевые турели',ic:'❂',d:'Дроны стреляют лазерами во врагов'},
  tick(w,dt){const ov=w.lv>5?Math.pow(1.15,w.lv-5):1;const n=[0,2,3,3,4,6][Math.min(5,w.lv)]+S.proj+(w.evo?2:0),R=(70+(w.lv>=3?20:0))*S.area,dmg=(7+3*Math.min(5,w.lv))*ov;w.a=(w.a||0)+dt*(3+(w.lv>=3?1.2:0));w.pos=[];
   if(w.evo){w.st=(w.st||0)-dt}
   for(let i=0;i<n;i++){const a=w.a+i/n*TAU,x=P.x+Math.cos(a)*R,y=P.y+Math.sin(a)*R;w.pos.push([x,y]);
    for(const e of enemies){if(e.dead)continue;const dx=e.x-x,dy=e.y-y;if(dx*dx+dy*dy<(e.r+11*S.area)**2&&T-(e.ho||-9)>.35){e.ho=T;hit(e,dmg,Math.atan2(dy,dx),w)}}
    if(w.evo&&w.st<=0){const t=nearest(x,y,380);if(t)shoot(x,y,Math.atan2(t.y-y,t.x-x),700,{r:4,dmg:dmg*1.2,pierce:2,life:.7,w,kind:'bolt'})}
    if(Math.random()<.5)part(x,y,rnd(20),rnd(20),.3,w.c,2)}
   if(w.evo&&w.st<=0)w.st=.6*S.cd}},
 emp:{n:'ЭМИ-импульс',ic:'◉',c:'#70ffd9',d:'Волна вокруг тебя отбрасывает врагов.',up:['','+радиус','+50% урона','-перезарядка','+радиус, оглушение'],
  evo:{req:'nano',n:'Плазменная буря',ic:'⚛',d:'Огромная волна, лечит при попадании'},
  cd:l=>3.2-.2*Math.min(5,l)-(l>=4?.5:0)-(l>5?.3:0),fire(w){const ov=w.lv>5?Math.pow(1.15,w.lv-5):1;const R=(110+(w.lv>=2?30:0)+(w.lv>=5?40:0)+(w.evo?60:0))*S.area,dmg=(10+(w.lv>=3?8:0)+3*Math.min(5,w.lv))*ov*(w.evo?1.5:1);
   rings.push({x:P.x,y:P.y,r:0,R,l:.45,ml:.45,c:w.c,w:10});rings.push({x:P.x,y:P.y,r:0,R:R*.7,l:.35,ml:.35,c:'#ffffff',w:3});
   let hc=0;for(const e of enemies){const dx=e.x-P.x,dy=e.y-P.y;if(!e.dead&&dx*dx+dy*dy<(R+e.r)**2){hc++;hit(e,dmg,Math.atan2(dy,dx),w,3.5);if(w.lv>=5)e.stun=w.evo?1.4:.8}}
   if(w.evo&&hc>=5)P.hp=Math.min(P.max,P.hp+2)}},
 rocket:{n:'Рой ракет',ic:'➶',c:'#4da6ff',d:'Самонаводящиеся ракеты со взрывом.',up:['','+1 ракета','+радиус взрыва','+1 ракета','+2 ракеты, +урон'],
  evo:{req:'area',n:'Ядерный залп',ic:'☢',d:'Огромные взрывы с разлётом осколков'},
  cd:l=>2.3-.15*Math.min(5,l),fire(w){const ov=w.lv>5?Math.pow(1.15,w.lv-5):1;const n=1+(w.lv>=2?1:0)+(w.lv>=4?1:0)+(w.lv>=5?2:0)+S.proj+(w.evo?2:0);
   for(let i=0;i<n;i++)shoot(P.x,P.y,Math.random()*TAU,260,{r:w.evo?8:6,dmg:(20+(w.lv>=5?12:0)+5*Math.min(5,w.lv))*ov*(w.evo?1.4:1),life:3,w,kind:'rocket',homing:1,cluster:w.evo?4:0,explode:(55+(w.lv>=3?25:0)+(w.evo?45:0))*S.area})}},
 mine:{n:'Нано-мины',ic:'✸',c:'#ffe600',d:'Мины на месте, взрываются при контакте.',up:['','+1 мина','+радиус','+1 мина','+80% урона'],
  evo:{req:'amp',n:'Сингулярность',ic:'✵',d:'Притягивает врагов перед мощным взрывом'},
  cd:l=>1.6-.1*Math.min(5,l),fire(w){const ov=w.lv>5?Math.pow(1.15,w.lv-5):1;const n=1+(w.lv>=2?1:0)+(w.lv>=4?1:0)+S.proj;
   for(let i=0;i<n;i++)mines.push({x:P.x+rnd(40),y:P.y+rnd(40),arm:.5,life:6,R:(75+(w.lv>=3?30:0)+(w.evo?40:0))*S.area,dmg:(30+8*Math.min(5,w.lv))*(w.lv>=5?1.8:1)*ov*(w.evo?1.5:1),pull:!!w.evo,w})}},
 disc:{n:'Рикошет-диск',ic:'◈',c:'#80ffff',d:'Диск отскакивает от краёв экрана.',up:['','+1 диск','+время жизни','+1 диск','+скорость и урон'],
  evo:{req:'crit',n:'Квантовый диск',ic:'❖',d:'Сверхбыстрый диск со взрывами при ударе'},
  cd:l=>3.2-.2*Math.min(5,l),fire(w){const ov=w.lv>5?Math.pow(1.15,w.lv-5):1;const n=1+(w.lv>=2?1:0)+(w.lv>=4?1:0)+S.proj+(w.evo?1:0);
   for(let i=0;i<n;i++)shoot(P.x,P.y,Math.random()*TAU,w.evo?640:(w.lv>=5?520:400),{r:(w.evo?14:11)*S.area,dmg:(10+(w.lv>=5?10:0)+3*Math.min(5,w.lv))*ov*(w.evo?1.5:1),pierce:1e9,rehit:w.evo?.25:.4,life:(3+(w.lv>=3?2:0))*S.dur,w,kind:'disc',bounce:1,blast:!!w.evo})}}
};
const PS={
 amp:{n:'Усилитель урона',ic:'▲',c:'#ff3c3c',d:'+12% урона'},
 cpu:{n:'Разгон ЦП',ic:'⌁',c:'#ffe600',d:'≈-11% перезарядки, дальше с затуханием'},
 area:{n:'Фокус-линзы',ic:'◌',c:'#ff8c00',d:'+12% области и длительности'},
 servo:{n:'Сервоприводы',ic:'»',c:'#3cff9e',d:'+8% скорости движения'},
 dup:{n:'Дубликатор',ic:'⧉',c:'#ffffff',d:'+1 снаряд всем оружиям'},
 armor:{n:'Кибер-броня',ic:'⛨',c:'#8c8cff',d:'-1 входящий урон, +20 HP'},
 nano:{n:'Наноботы',ic:'✚',c:'#ff5cf4',d:'+0.5 HP/сек регенерация'},
 magnet:{n:'Магнит',ic:'∩',c:'#00f0ff',d:'+35% радиус сбора опыта'},
 crit:{n:'Нейрочип',ic:'✪',c:'#ffd700',d:'+7.8 п.п. крита (x2.5), дальше с затуханием'}
};
const EN={
 drone:{r:10,hp:8,spd:72,dmg:8,c:'#ff2a6d',xp:1,n:6},
 runner:{r:8,hp:6,spd:135,dmg:6,c:'#ff6b35',xp:1,n:3},
 brute:{r:19,hp:45,spd:46,dmg:15,c:'#c9184a',xp:5,n:4},
 spitter:{r:12,hp:22,spd:58,dmg:8,c:'#ff9f1c',xp:3,n:4,shoot:2.2},
 split:{r:14,hp:26,spd:60,dmg:10,c:'#c56cff',xp:3,n:5,split:2},

 icons.forEach(([d,l,ev],i)=>{const row=i<P.weps.length?0:1,col=row?i-P.weps.length:i,x=14+col*44,y=H-96+row*46;

 // final boss bar & pointer
 const fb=enemies.find(e=>e.final);
 if(fb){const bw=Math.min(460,W-80),bx=W/2-bw/2,by=56;ctx.fillStyle='rgba(20,0,10,.8)';ctx.fillRect(bx,by,bw,14);ctx.fillStyle='#ff0055';ctx.fillRect(bx,by,bw*Math.max(0,fb.hp)/fb.max,14);
  ctx.strokeStyle='#ff0055';ctx.lineWidth=1.5;ctx.strokeRect(bx,by,bw,14);ctx.font='bold 12px Consolas';ctx.fillStyle='#fff';ctx.fillText('АРХИТЕКТОР СЕТИ: '+Math.ceil(fb.hp)+' HP',W/2,by+7);
  arrow(fb.x,fb.y,'#ff0055',18)}
 for(const it of items)if(it.t==='chest')arrow(it.x,it.y,'#ffd700',14);
 for(const e of enemies)if(e.chest&&!e.boss)arrow(e.x,e.y,e.c,14);
 for(const b of banners){const a=Math.min(1,b.l,(3-b.l)*4);ctx.globalAlpha=a;ctx.font='bold '+(W<620?15:26)+'px Consolas';ctx.textBaseline='middle';const y=H*.22,j=Math.random()<.1?rnd(6):0;
  ctx.fillStyle='#ff2a6d';ctx.fillText(b.t,W/2+3+j,y);ctx.fillStyle='#00f0ff';ctx.fillText(b.t,W/2-3-j,y);ctx.fillStyle=b.c;ctx.fillText(b.t,W/2,y);ctx.globalAlpha=1}
 if(Q){const qw=Math.min(256,W-28),x=W-qw-14,y=W<620?76:50,k=Math.min(1,Q.prog/Q.goal),fs=W<620?11:13;
  ctx.textAlign='left';ctx.textBaseline='top';ctx.fillStyle='rgba(20,10,0,.7)';ctx.fillRect(x,y,qw,64);ctx.strokeStyle='#ffd700';ctx.lineWidth=1.5;ctx.strokeRect(x,y,qw,64);
  ctx.font='bold '+fs+'px Consolas';ctx.fillStyle='#ffd700';ctx.fillText('КОНТРАКТ  +'+Q.rew+' XP',x+8,y+6);

  if(Q.ty==='zone')arrow(Q.zx,Q.zy,'#ffd700',16)}
 // dash / rerolls / buff / combo / mode

 ctx.fillStyle='#ffd700';ctx.fillText('⟳ '+P.rerolls,14,58);
 if(P.buff>0){ctx.fillStyle='#ff2bd6';ctx.fillText('×2 УРОН '+P.buff.toFixed(1)+'с',70,58)}
 if(combo>2){ctx.textAlign='center';ctx.font='bold '+Math.round(16+Math.min(14,combo))+'px Consolas';ctx.fillStyle='#ffe600';ctx.fillText('×'+combo,W/2,H-42)}

 if(stick){ctx.strokeStyle='rgba(0,240,255,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(stick.x0,stick.y0,60,0,TAU);ctx.stroke();
  ctx.fillStyle='rgba(0,240,255,.4)';ctx.beginPath();ctx.arc(stick.x0+stick.dx*60,stick.y0+stick.dy*60,22,0,TAU);ctx.fill()}
 if(P.hp<P.max*.3){ctx.fillStyle=`rgba(255,0,60,${(.12+.08*Math.sin(t*8))*FXA()})`;ctx.fillRect(0,0,W,H)}}

let last=performance.now(),crashed=false,acc=0;
function crashReport(err){if(crashed)return;crashed=true;state='crash';
 const msg=(err&&(err.stack||err.message))||String(err);
 const snap={state,T:+(T||0).toFixed(2),lvl,kills,pending,W,H,
  counts:P?{en:enemies.length,proj:proj.length,ebul:ebul.length,parts:parts.length,gems:gems.length}:null,
  weps:P?P.weps.map(w=>w.k+':'+w.lv+(w.evo?'*':'')):null,pas:P?P.pas:null,quest:Q?Q.ty+':'+Math.floor(Q.prog)+'/'+Q.goal:null};
 const log=`=== NEON SURVIVORS ${VER} CRASH LOG ===\n${msg}\n\nSTATE:\n${JSON.stringify(snap,null,2)}\nUA: ${navigator.userAgent}`;
 ui.innerHTML=`<div class="panel"><h2 style="color:#ff2a6d">СБОЙ ИГРЫ (ЛОГИ)</h2><p>Игра остановилась из-за ошибки. Скопируй лог ниже для отладки:</p>
 <textarea id="crashlog" readonly style="width:100%;height:190px;background:#05010d;color:#0ff;border:1px solid #ff2a6d;font:12px Consolas;padding:8px;box-sizing:border-box"></textarea><br>
 <button onclick="copyCrashLog()">СКОПИРОВАТЬ ЛОГИ</button><button onclick="location.reload()">ПЕРЕЗАГРУЗИТЬ</button></div>`;
 document.getElementById('crashlog').value=log}
function copyCrashLog(){const el=document.getElementById('crashlog');if(!el)return;
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(el.value).catch(()=>{el.select();document.execCommand('copy')});
 else{el.select();document.execCommand('copy')}}
addEventListener('error',e=>crashReport(e.error||e.message));
addEventListener('unhandledrejection',e=>crashReport(e.reason));
function loop(now){if(crashed)return;
 try{let dt=Math.min(.25,(now-last)/1000);last=now;
  if(rain)for(const r of rain){r.y+=r.s*dt;r.x-=r.s*.25*dt;if(r.y>H){r.y=-20;r.x=Math.random()*(W+200)}}
  gamepad();music(dt);
  if(hitStop>0){hitStop-=dt;dt=0}
  acc+=dt;const step=1/60;let n=0;
  while(acc>=step&&n<6){acc-=step;n++;
   if(state==='play')update(step);else if(state==='dying')deathUpdate(step);else if(state==='victory')victoryUpdate(step);else{acc=0;break}}
  if(n>=6)acc=0;
  draw(now);requestAnimationFrame(loop)
 }catch(err){crashReport(err)}}
function menu(){state='menu';setSeed(0);if(!rain||!rain.length)mkRain();
 const b=+localStorage.getItem('neonsurv_best')||0,be=+localStorage.getItem('neonsurv_best_endless')||0;
 ui.innerHTML=`<div class="panel" style="width:min(430px,94vw)"><h1>NEON SURVIVORS</h1><p>Мегаполис захвачен вирусным роем.<br>Продержись <b style="color:#ffe600">15 минут</b> и уничтожь Архитектора Сети.</p>
 <p style="color:#ffd700;font-size:18px">¤ ${META.cr} кредитов</p>
 <div style="display:flex;flex-direction:column;align-items:center">
 <button style="width:min(260px,80vw);font-size:20px" onclick="menuPlay()">▶ ИГРАТЬ</button>
 <button style="width:min(260px,80vw)" onclick="MODE.daily=true;MODE.seed=0;menuPlay()">📅 ЗАБЕГ ДНЯ</button>
 <button style="width:min(260px,80vw)" onclick="menuShop()">⚙ МАСТЕРСКАЯ</button>
 <button style="width:min(260px,80vw)" onclick="menuStats()">☰ СТАТИСТИКА</button>
 <button style="width:min(260px,80vw)" onclick="menuSettings('menu')">🔊 НАСТРОЙКИ</button>
 <button style="width:min(260px,80vw)" onclick="menuHelp()">? КАК ИГРАТЬ</button></div>
 <p style="font-size:12px">рекорд: ${b}${be?' · endless: '+be:''}</p></div>`}
function menuPlay(){state='menu';
 ui.innerHTML=`<div class="panel"><h2>ПРОФИЛЬ И СТАРТОВОЕ ОРУЖИЕ</h2><p style="color:#ffd700">¤ ${META.cr}</p>
 <div class="cards">${Object.keys(CH).map(k=>{const c=CH[k],on=MODE.ch===k;
  return `<button class="card" style="width:146px;min-height:104px;padding:8px;border-color:${on?'#ffffff':c.c};box-shadow:0 0 ${on?18:8}px ${c.c}" onclick="MODE.ch='${k}';menuPlay()"><div class="ic" style="color:${c.c};font-size:24px;margin:0 0 4px">${c.ic}</div><div class="nm" style="font-size:13px">${c.n}${on?' ✓':''}</div><div class="ds">${c.d}</div></button>`}).join('')}</div>
 <div><button style="border-color:${MODE.daily?'#ffd700':'#0ff'};color:${MODE.daily?'#ffd700':'#0ff'}" onclick="MODE.daily=!MODE.daily;MODE.seed=0;menuPlay()">📅 DAILY ${MODE.daily?'ВКЛ':'ВЫКЛ'}</button>
 <button style="border-color:${MODE.hyper?'#ff2bd6':'#0ff'};color:${MODE.hyper?'#ff2bd6':'#0ff'}" onclick="MODE.hyper=!MODE.hyper;menuPlay()">⚡ HYPER ${MODE.hyper?'ВКЛ':'ВЫКЛ'}</button>
 <button onclick="askSeed()">🎲 SEED${MODE.seed?' '+MODE.seed:''}</button></div>
 <div class="cards">${Object.keys(WP).map(k=>{const d=WP[k],lock=UNLOCK[k]&&!META.unl[k];
  return `<button class="card" style="border-color:${lock?'#555':d.c};box-shadow:0 0 14px ${lock?'#222':d.c};min-height:150px;width:170px;${lock?'opacity:.7':''}" onclick="${lock?`unlockW('${k}')`:`newGame('${k}')`}"><div class="ic" style="color:${lock?'#777':d.c};text-shadow:0 0 14px ${d.c}">${lock?'🔒':d.ic}</div><div class="nm">${d.n}</div><div class="ds">${lock?`Открыть за <b style="color:#ffd700">${UNLOCK[k]} ¤</b>`:d.d}</div>${lock?'':evoHint(k)}</button>`}).join('')}</div>
 <button onclick="menu()">◀ НАЗАД</button></div>`}
function askSeed(){const v=prompt('Seed забега (число). Пусто = случайный:',MODE.seed||'');if(v===null)return;
 const n=parseInt(v,10);MODE.seed=isNaN(n)?0:n>>>0;MODE.daily=false;menuPlay()}
function unlockW(k){if(META.cr<UNLOCK[k])return;META.cr-=UNLOCK[k];META.unl[k]=1;saveMeta();menuPlay()}
function menuShop(){state='menu';
 ui.innerHTML=`<div class="panel"><h2>⚙ МАСТЕРСКАЯ</h2><p>Постоянные улучшения действуют во всех забегах.</p><p style="color:#ffd700;font-size:18px">¤ ${META.cr}</p><div class="cards">${Object.keys(MU).map(k=>{const u=MU[k],l=mu(k),mx=l>=u.max,c=muCost(k),can=!mx&&META.cr>=c;
  return `<button class="card" style="border-color:${u.c};box-shadow:0 0 10px ${u.c};width:165px;min-height:150px;padding:10px;${can||mx?'':'opacity:.55'}" onclick="buyMeta('${k}')"><div class="ic" style="color:${u.c};font-size:30px;margin:2px 0 6px">${u.ic}</div><div class="nm" style="font-size:15px">${u.n}</div><div class="lv">${l}/${u.max}</div><div class="ds">${u.d}</div><div style="margin-top:6px;color:${mx?'#3cff9e':'#ffd700'}">${mx?'МАКС':c+' ¤'}</div></button>`}).join('')}</div>
 <button onclick="menu()">◀ НАЗАД</button><button onclick="menuPlay()">▶ ИГРАТЬ</button></div>`}
function buyMeta(k){const c=muCost(k);if(mu(k)>=MU[k].max||META.cr<c)return;META.cr-=c;META.up[k]=mu(k)+1;saveMeta();menuShop()}
function menuStats(){const s=META.st;let top=[],day=[];
 try{top=JSON.parse(localStorage.getItem('neonsurv_top')||'[]');day=JSON.parse(localStorage.getItem('neonsurv_daily_'+dayKey())||'[]')}catch(e){}
 const row=(r,i)=>`<tr><td>${i+1}</td><td>${r.sc}</td><td>${fmt(r.t)}</td><td>${r.win?'★':'·'}${r.hyper?'⚡':''}${r.endless?'∞':''}</td><td style="font-size:11px">${(CH[r.ch]||CH.op).ic} ${r.w}</td></tr>`;
 ui.innerHTML=`<div class="panel"><h2>☰ СТАТИСТИКА</h2><table>
 <tr><td>Забегов</td><td>${s.runs}</td></tr><tr><td>Побед</td><td>${s.wins}</td></tr><tr><td>Всего убито</td><td>${s.kills}</td></tr>
 <tr><td>Лучшее время</td><td>${fmt(s.bestT)}</td></tr><tr><td>Заработано кредитов</td><td>${s.earned} ¤</td></tr><tr><td>Рекорд счёта</td><td>${+localStorage.getItem('neonsurv_best')||0}</td></tr></table>
 ${top.length?`<h2 style="font-size:15px">ЛОКАЛЬНЫЙ ТОП-10</h2><table>${top.map(row).join('')}</table>`:''}
 ${day.length?`<h2 style="font-size:15px">DAILY ${dayKey()} · SEED ${dailySeed()}</h2><table>${day.map(row).join('')}</table>`:''}
 <button onclick="menu()">◀ НАЗАД</button><button onclick="resetMeta()" style="border-color:#ff2a6d;color:#ff2a6d;box-shadow:0 0 8px #ff2a6d">СБРОСИТЬ ПРОГРЕСС</button></div>`}
function resetMeta(){if(!confirm('Сбросить все кредиты, улучшения и статистику?'))return;localStorage.removeItem('neonsurv_meta');localStorage.removeItem('neonsurv_best');META=loadMeta();menu()}
function menuHelp(){
 ui.innerHTML=`<div class="panel" style="text-align:left;max-width:620px"><h2 style="text-align:center">? КАК ИГРАТЬ</h2><p>
 • <b>WASD / стрелки</b> - движение. Оружие стреляет само. <b>Esc</b> - пауза, <b>M</b> - звук.<br>
 • <b>Space</b> - рывок (0.25 с неуязвимости, откат 3 с). Геймпад: стик + A/RB.<br>
 • <b>Телефон</b>: палец слева - джойстик, тап справа - пауза, двойной тап - рывок.<br>
 • На уровне: <b>1/2/3</b> - выбор, <b>R</b> - реролл, <b>X</b> - пропустить (+15 HP).<br>
 • Собирай кристаллы опыта, на каждом уровне выбирай 1 из 3 улучшений (до 6 оружий и 6 предметов).<br>
 • Оружие 5 ур. + нужный предмет = <b style="color:#ffd700">ЭВОЛЮЦИЯ</b> (требование видно в карточке).<br>
 • <b style="color:#ffd700">Контракты</b>: опыт + реролл + ×2 урон на 10 с, каждый 3-й подряд - мини-кейс.<br>
 • Элитки носят аффиксы: ускоренный / бронированный / вампир / штормовой. Щитоносцев бей с тыла.<br>
 • Каждую минуту - элита с кейсом, на 5 и 10 минуте - босс, на 15:00 - финальный босс.<br>
 • За каждый забег получаешь <b style="color:#ffd700">кредиты ¤</b> - трать их в Мастерской на постоянные улучшения и новое оружие.</p>
 <div style="text-align:center"><button onclick="menu()">◀ НАЗАД</button></div></div>`}
menu();requestAnimationFrame(loop);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
</script>
